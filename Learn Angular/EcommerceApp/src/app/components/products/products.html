<div class="container my-5">
  <div class="row row-cols-1 row-cols-md-4 g-4">

    <!-- البطاقة الأولى -->
    <div class="col" *ngFor="let product of products">

      <div class="card h-100 border-0 shadow">
        <img [src]="product.imageUrl" [alt]="product.name" class="card-img-top">
        <div class="card-body text-center py-4">
          <div class="fs-1 text-primary mb-3"><i class="bi bi-laptop"></i></div>
          <h5 class="card-title fw-bold">{{product.name}}</h5>
            <p class="card-text text-muted">{{product.description}}</p>
            <p class="card-text fw-bold text-success">السعر: {{product.price | currency:'USD'}}</p>
            <p class="card-text fw-bold text-info">الكمية: {{product.quantity}}</p>
          <a href="#" class="btn btn-outline-primary mt-3">شراء الآن</a>


        </div>
      </div>
    </div>


  </div>
</div>
